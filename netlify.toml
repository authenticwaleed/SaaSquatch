# Netlify build configuration.
#
# Do NOT set `publish` here. Setting it to ".next" makes Netlify treat the build
# output as a plain static directory: the Next.js Runtime never attaches, no
# functions are deployed, every route 404s, and the internal build manifests get
# served publicly. The Runtime sets the publish directory itself.
#
# The Runtime is declared explicitly rather than relying on auto-detection,
# which did not attach on the first deploy.

[build]
  command = "npm run build"

[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
